<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearList</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <section id="login-view" class="panel login-panel">
      <p class="eyebrow">CLEARLIST</p>
      <h1>Make room for what matters.</h1>
      <p class="muted">Sign in to keep your todos synced in your account.</p>
      <form id="login-form">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required>
        <label for="otp">One-time password</label>
        <input id="otp" name="otp" inputmode="numeric" maxlength="6" placeholder="123456" required>
        <button type="submit">Sign in</button>
      </form>
      <p id="login-message" class="message"></p>
    </section>

    <section id="app-view" class="app-view hidden">
      <header class="topbar">
        <div>
          <p class="eyebrow">YOUR SPACE</p>
          <h1>Today, thoughtfully.</h1>
        </div>
        <div class="user-actions">
          <span id="user-email" class="muted"></span>
          <button id="logout-button" class="button-secondary" type="button">Sign out</button>
        </div>
      </header>
      <section class="todo-section">
        <form id="todo-form" class="todo-form">
          <input id="todo-title" type="text" placeholder="What needs doing?" maxlength="255" required>
          <button type="submit">Add todo</button>
        </form>
        <p id="todo-message" class="message"></p>
        <div id="todo-list" class="todo-list"></div>
        <p id="empty-state" class="empty-state">Your list is clear. Add your first todo above.</p>
      </section>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
